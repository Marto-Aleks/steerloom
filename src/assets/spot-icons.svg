<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
  <!--
    Steerloom spot icons (status + feature).
    Do NOT hide this sprite with display:none — gradients would stop rendering. Keep the 0x0 absolute style.
    Usage: <svg class="spot" width="48" height="48"><use href="#spot-at-risk"/></svg>
    Each symbol = 48x48 tile: status gradient, top highlight, soft inner edge, white 24px glyph (stroke 2.25, round caps/joins).
    Colors mirror steerloom-design-system tokens. Keep hex values in sync with tokens.css.
  -->
  <defs>
    <linearGradient id="g-risk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E5735C"/><stop offset="1" stop-color="#C2412D"/></linearGradient>
    <linearGradient id="g-warn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EBA552"/><stop offset="1" stop-color="#C46A24"/></linearGradient>
    <linearGradient id="g-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A98F2"/><stop offset="1" stop-color="#2A62D4"/></linearGradient>
    <linearGradient id="g-ok" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#55BB8E"/><stop offset="1" stop-color="#2F8F66"/></linearGradient>
    <linearGradient id="g-ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5E6B86"/><stop offset="1" stop-color="#2F3A50"/></linearGradient>
    <linearGradient id="g-shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>

    <!-- Shared tile chrome: highlight + inner edge. Drawn on top of the gradient fill. -->
    <g id="tile-chrome">
      <rect width="48" height="48" rx="14" fill="url(#g-shine)"/>
      <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="13.25" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- ===== Status ===== -->
  <symbol id="spot-at-risk" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-risk)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12.5" r="7.5"/><path d="M12 8.5v4.25l2.75 1.75"/><path d="M5.5 4.5 3.5 6.5M18.5 4.5l2 2"/>
    </g>
  </symbol>

  <symbol id="spot-bottleneck" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-warn)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.5 5.5h15l-5.75 6.75v5.5L10.25 19.5v-7.25z"/>
    </g>
  </symbol>

  <symbol id="spot-aging" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-warn)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 4h10M7 20h10"/><path d="M8 4v2.5L12 12l4-5.5V4M8 20v-2.5L12 12l4 5.5V20"/>
    </g>
  </symbol>

  <symbol id="spot-rework" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-info)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12a7 7 0 1 1-2.05-4.95"/><path d="M17.5 3.5v4h-4"/>
    </g>
  </symbol>

  <symbol id="spot-on-track" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-ok)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="7.5"/><path d="m8.75 12.25 2.25 2.25 4.25-4.5"/>
    </g>
  </symbol>

  <!-- ===== Features (brand blue) ===== -->
  <symbol id="spot-forecast" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-info)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="5.5" width="16" height="14" rx="3"/><path d="M8 3.5v4M16 3.5v4M4 10h16"/><circle cx="14.5" cy="15" r="1.25" fill="#fff" stroke="none"/>
    </g>
  </symbol>

  <symbol id="spot-throughput" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-info)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 19v-5M12 19V8M18 19v-8"/><path d="M4 20.5h16"/>
    </g>
  </symbol>

  <symbol id="spot-cycle-time" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-info)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="13" r="7"/><path d="M12 13V9.5M10 3.5h4"/>
    </g>
  </symbol>

  <symbol id="spot-read-only" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-ink)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/><path d="M12 14.5v2"/>
    </g>
  </symbol>

  <symbol id="spot-shows-working" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-ink)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3.5h12v17l-2-1.25-2 1.25-2-1.25-2 1.25-2-1.25-2 1.25z"/><path d="M9 8.5h6M9 12h6M9 15.5h3"/>
    </g>
  </symbol>

  <symbol id="spot-runs-anywhere" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-ink)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.5 11.5a4 4 0 0 1 .5-7.95A5 5 0 0 1 17.6 5 3.5 3.5 0 0 1 17 11.5z"/><rect x="5" y="14.5" width="14" height="6" rx="2"/><path d="M8.5 17.5h.01"/>
    </g>
  </symbol>

  <symbol id="spot-assistant" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-info)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 6.5a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-4.5L7.5 19v-3.6A3 3 0 0 1 5 12.5z"/><path d="M9 9.5h6M9 12.25h3.5"/>
    </g>
  </symbol>

  <!--
    ===== Added for the app (same tile + glyph rules, icon-spec §7) =====
    Glyphs sit on the 24px grid with 2px padding, stroke 2.25, round caps/joins.
  -->

  <!-- Status: data checks -->
  <symbol id="spot-attention" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-warn)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4.5 20 18.5H4z"/><path d="M12 10v3.25M12 16h.01"/>
    </g>
  </symbol>

  <symbol id="spot-blocked" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-risk)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="7.5"/><path d="m9.5 9.5 5 5M14.5 9.5l-5 5"/>
    </g>
  </symbol>

  <!-- Features (brand blue) -->
  <symbol id="spot-usual-limit" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-info)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4.6 17.5a8 8 0 1 1 14.8 0"/><path d="m12 14.5 3.5-4"/>
    </g>
  </symbol>

  <symbol id="spot-briefing" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-info)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5.5" y="3.5" width="13" height="17" rx="3"/><path d="M9 9h6M9 12.5h6M9 16h3.5"/>
    </g>
  </symbol>

  <symbol id="spot-board" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-info)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.5 5.5v13M12 5.5v7.5M17.5 5.5v10"/>
    </g>
  </symbol>

  <symbol id="spot-team" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-info)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9.5" cy="8.5" r="3.25"/><path d="M3.75 19a5.75 5.75 0 0 1 11.5 0"/><path d="M15.5 5.4a3.25 3.25 0 0 1 0 6.2M17.75 14.4A5.75 5.75 0 0 1 20.25 19"/>
    </g>
  </symbol>

  <symbol id="spot-download" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-info)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 4v10.5M7.5 10l4.5 4.5 4.5-4.5"/><path d="M5 19.5h14"/>
    </g>
  </symbol>

  <!-- Trust & infrastructure (ink) -->
  <symbol id="spot-cloud" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-ink)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7.5 18a4.5 4.5 0 0 1-.6-8.96 5.5 5.5 0 0 1 10.7.46A4.25 4.25 0 0 1 16.75 18z"/>
    </g>
  </symbol>

  <symbol id="spot-plug" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-ink)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9.5 4v4M14.5 4v4"/><path d="M6.5 8h11v3a5.5 5.5 0 0 1-11 0z"/><path d="M12 16.5v3.5"/>
    </g>
  </symbol>

  <symbol id="spot-secure" viewBox="0 0 48 48">
    <rect width="48" height="48" rx="14" fill="url(#g-ink)"/><use href="#tile-chrome"/>
    <g transform="translate(12 12)" fill="none" stroke="#fff" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3.5 19 6.25v5.25c0 4.4-3 7.4-7 9-4-1.6-7-4.6-7-9V6.25z"/><path d="m9 12 2.25 2.25L15.5 10"/>
    </g>
  </symbol>
</svg>
